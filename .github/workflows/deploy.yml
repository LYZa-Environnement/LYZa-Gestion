name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Aucune dépendance à installer : le build n'utilise que Node.
      - name: Assemblage et chiffrement
        run: node scripts/build.mjs
        env:
          # Mot de passe de la page (obligatoire). Sans lui, la page publiée
          # indique seulement « non configuré ».
          LYZA_OUTILS_MDP: ${{ secrets.LYZA_OUTILS_MDP }}
          # Coordonnées bancaires pré-remplies (facultatives), intégrées
          # uniquement dans la page chiffrée.
          LYZA_IBAN: ${{ secrets.LYZA_IBAN }}
          LYZA_BIC: ${{ secrets.LYZA_BIC }}
          LYZA_BANQUE: ${{ secrets.LYZA_BANQUE }}
          LYZA_TITULAIRE: ${{ secrets.LYZA_TITULAIRE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
